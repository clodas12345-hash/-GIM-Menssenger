name: Criar APK Direto

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Baixar codigo
      uses: actions/checkout@v4

    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'


    - name: Instalar dependências
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Configurar Capacitor e Android
      run: |
        # Sincroniza o Capacitor e cria a pasta android se não existir
        npx cap add android || true
        # Gera os ícones personalizados a partir da logo
        node generate-icons.cjs || true
        npx @capacitor/assets generate --android || true
        npx cap sync android

    - name: Compilar APK (Gradle)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Guardar o APK
      uses: actions/upload-artifact@v4
      with:
        name: GKD-Mobility-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
